        <script>
    const container = document.querySelector('.container');
    const sections = Array.from(document.querySelectorAll('.menu-link')).map(link => ({
        link,
        el: document.getElementById(link.dataset.target)
    })).filter(s => s.el);

    let currentActive = -1;
    let isAnimating = false;
    let debounceTimer = null;

    function getVisiblePixels(el, top, height) {
        const start = Math.max(top, el.offsetTop);
        const end = Math.min(top + height, el.offsetTop + el.offsetHeight);
        return Math.max(0, end - start);
    }

    function findMostVisible() {
        const top = container.scrollTop;
        const height = container.clientHeight;
        
        let bestIndex = -1;
        let maxPixels = height * 0.3; // 30% threshold
        
        sections.forEach((sec, i) => {
            const pixels = getVisiblePixels(sec.el, top, height);
            if (pixels > maxPixels) {
                maxPixels = pixels;
                bestIndex = i;
            }
        });
        
        return bestIndex;
    }

    function updateActive(newIndex) {
        if (newIndex === -1 || newIndex === currentActive) return;
        
        sections.forEach((sec, i) => {
            sec.link.classList.toggle('active', i === newIndex);
        });
        currentActive = newIndex;
    }

    function onScroll() {
        if (isAnimating) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                isAnimating = false;
                updateActive(findMostVisible());
            }, 150);
        } else {
            updateActive(findMostVisible());
        }
    }

    sections.forEach((sec, i) => {
        sec.link.addEventListener('click', (e) => {
            e.preventDefault();
            updateActive(i);
            isAnimating = true;
            clearTimeout(debounceTimer);
            sec.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    });

    container.addEventListener('scroll', onScroll);
    window.addEventListener('resize', onScroll);
    
    setTimeout(onScroll, 100);
</script>
        <script>
        (function() {
            let sqOverlayStyle = null;

            // Create checkbox
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = 'sqOverlayCheckbox';
            checkbox.checked = true; // start checked
            checkbox.style.position = 'fixed';
            checkbox.style.top = '10px';
            checkbox.style.left = '10px';
            checkbox.style.zIndex = '1000001';

            // Label (optional)
            const label = document.createElement('label');
            label.htmlFor = 'sqOverlayCheckbox';
            label.style.position = 'fixed';
            label.style.top = '10px';
            label.style.left = '35px';
            label.style.zIndex = '1000001';
            label.style.fontFamily = 'monospace';
            label.style.fontSize = '12px';

            document.body.appendChild(checkbox);
            document.body.appendChild(label);

            // Toggle overlay
            function toggleSQOverlay() {
                if (checkbox.checked) {
                    if (!sqOverlayStyle) {
                        sqOverlayStyle = document.createElement('style');
                        sqOverlayStyle.id = 'sq-overlay';
                        sqOverlayStyle.textContent = `
                            .SQ {
                                background-color: rgba(0, 255, 0, .15);
                                z-index: 99;
                                position: fixed;
                                user-select: none;
                                pointer-events: none;
                                width: calc(100vw - calc((var(--maxWidth) / var(--baseValue)) * 2));
                                height: calc(100vh - calc((var(--maxWidth) / var(--baseValue)) * 2));
                                margin: calc((var(--maxWidth) / var(--baseValue)) * 1);
                            }
                            div, a, svg, p, img, * {
                                background-color: rgba(255, 0, 0, .15);
                            }
                        `;
                        document.head.appendChild(sqOverlayStyle);
                    }
                } else {
                    const existing = document.getElementById('sq-overlay');
                    if (existing) existing.remove();
                    sqOverlayStyle = null;
                }
            }

            checkbox.addEventListener('change', toggleSQOverlay);

            // Apply initial checked state
            toggleSQOverlay();
        })();
        </script>
