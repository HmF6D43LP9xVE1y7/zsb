        <script>
    const container = document.querySelector('.container');
    const sections = Array.from(document.querySelectorAll('.menu-link')).map(link => ({
        link,
        el: document.getElementById(link.dataset.target)
    })).filter(s => s.el);

    let currentActive = -1;
    let isAnimating = false;
    let debounceTimer = null;

    function getVisiblePixels(el, top, height) {
        const start = Math.max(top, el.offsetTop);
        const end = Math.min(top + height, el.offsetTop + el.offsetHeight);
        return Math.max(0, end - start);
    }

    function findMostVisible() {
        const top = container.scrollTop;
        const height = container.clientHeight;
        
        let bestIndex = -1;
        let maxPixels = height * 0.3; // 30% threshold
        
        sections.forEach((sec, i) => {
            const pixels = getVisiblePixels(sec.el, top, height);
            if (pixels > maxPixels) {
                maxPixels = pixels;
                bestIndex = i;
            }
        });
        
        return bestIndex;
    }

    function updateActive(newIndex) {
        if (newIndex === -1 || newIndex === currentActive) return;
        
        sections.forEach((sec, i) => {
            sec.link.classList.toggle('active', i === newIndex);
        });
        currentActive = newIndex;
    }

    function onScroll() {
        if (isAnimating) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                isAnimating = false;
                updateActive(findMostVisible());
            }, 150);
        } else {
            updateActive(findMostVisible());
        }
    }

    sections.forEach((sec, i) => {
        sec.link.addEventListener('click', (e) => {
            e.preventDefault();
            updateActive(i);
            isAnimating = true;
            clearTimeout(debounceTimer);
            sec.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    });

    container.addEventListener('scroll', onScroll);
    window.addEventListener('resize', onScroll);
    
    setTimeout(onScroll, 100);
</script>

                <script>
(function() {
    let sqOverlayStyle = null;

    // Create checkbox
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = 'sqOverlayCheckbox';
    checkbox.style.position = 'fixed';
    checkbox.style.top = '10px';
    checkbox.style.left = '10px';
    checkbox.style.zIndex = '1000001';

    // Label (optional)
    const label = document.createElement('label');
    label.htmlFor = 'sqOverlayCheckbox';
    label.style.position = 'fixed';
    label.style.top = '10px';
    label.style.left = '35px';
    label.style.zIndex = '1000001';
    label.style.fontFamily = 'monospace';
    label.style.fontSize = '12px';

    document.body.appendChild(checkbox);
    document.body.appendChild(label);

    // Toggle overlay
    function toggleSQOverlay() {
        if (checkbox.checked) {
            sqOverlayStyle = document.createElement('style');
            sqOverlayStyle.id = 'sq-overlay';
            sqOverlayStyle.textContent = `
                .SQ {
                    background-color: rgba(0, 255, 0, .15);
                    z-index: 99;
                    position: fixed;
                    user-select: none;
                    pointer-events: none;
                    width: calc(100vw - calc((var(--maxWidth) / var(--baseValue)) * 2));
                    height: calc(100vh - calc((var(--maxWidth) / var(--baseValue)) * 2));
                    margin: calc((var(--maxWidth) / var(--baseValue)) * 1);
                }
                div, a, svg, p, img, * {
                    background-color: rgba(255, 0, 0, .15);
                }
            `;
            document.head.appendChild(sqOverlayStyle);
        } else {
            const existing = document.getElementById('sq-overlay');
            if (existing) existing.remove();
            sqOverlayStyle = null;
        }
    }

    checkbox.addEventListener('change', toggleSQOverlay);
})();

</script>








<script>
(function() {
    const instances = [
        {
            containerSelector: '#courses',
            checkboxId: 'menu-expand-courses',
            collapsedRows: 2.5,
            expandedRows: 28,
            positionTop: 'calc((var(--mWbV)) * 1)',
            positionRight: 'calc((var(--mWbV)) * 1)',
            labelText: 'container erweitern...'
        }
        // add more checkboxes here, array
    ];
    
    instances.forEach(c => {
        const el = document.querySelector(c.containerSelector);
        if (!el) return;
        
        el.style.cssText = 'position:relative;grid-template-columns:repeat(var(--baseValue), calc(var(--mWbV)));grid-template-rows:repeat(' + c.expandedRows + ', calc(var(--mWbV)));max-height:calc(' + c.collapsedRows + ' * var(--mWbV));transition:max-height 0.15s ease-out;z-index:0;';
        
        const wrap = document.createElement('div');
        wrap.style.cssText = 'position:absolute;top:' + c.positionTop + ';right:' + c.positionRight + ';z-index:999;display:flex;align-items:center;gap:calc((var(--mWbV)) * 0.25);pointer-events:auto;';
        
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = c.checkboxId;
        cb.checked = false;
        cb.style.cssText = 'cursor:pointer;width:calc((var(--mWbV)) * 0.6);height:calc((var(--mWbV)) * 0.6);flex-shrink:0;';
        
        const lb = document.createElement('label');
        lb.htmlFor = c.checkboxId;
        lb.textContent = c.labelText;
        lb.style.cssText = 'font-family:monospace;font-size:calc((var(--mWbV)) * 0.35);cursor:pointer;user-select:none;white-space:nowrap;';
        
        wrap.append(cb, lb);
        el.prepend(wrap);
        
        cb.onchange = function() {
            el.style.maxHeight = 'calc(' + (this.checked ? c.expandedRows : c.collapsedRows) + ' * var(--mWbV))';
        };
    });
})();
</script>



<script>
    (function() {
  const container = document.querySelector('#courses') || document.querySelector('.courses');
  if (!container) return;

  // Ensure relative positioning only if needed
  if (window.getComputedStyle(container).position === 'static') {
    container.style.position = 'relative';
  }

  const style = document.createElement('style');
  style.textContent = `
    .animated-warning-border::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 12px;
      background: repeating-linear-gradient(
       -45deg,
        rgb(255, 247, 220) 0px,
        rgb(255, 247, 220) 8px,
        rgba(232, 50, 0, 1) 8px,
        rgba(232, 50, 0, 1) 16px
      );
      background-size: 23px 23px;
      animation: stripeSlide 0.8s linear infinite;
      z-index: 1;
    }

    .animated-warning-border .bottom-border {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background: repeating-linear-gradient(
        -45deg,
        rgb(255, 247, 220) 0px,
        rgb(255, 247, 220) 8px,
        rgba(232, 50, 0, 1) 8px,
        rgba(232, 50, 0, 1) 16px
      );
      background-size: 23px 23px;
      animation: stripeSlideReverse 0.8s linear infinite;
      z-index: 1;
    }

    @keyframes stripeSlide {
      from { background-position: 0 0; }
      to { background-position: 23px 23px; }
    }

    @keyframes stripeSlideReverse {
      from { background-position: 23px 23px; }
      to { background-position: 0 0; }
    }
  `;

  document.head.appendChild(style);
  container.classList.add('animated-warning-border');

  // Add bottom border as separate element (doesn't conflict with your ::after)
  const bottomBorder = document.createElement('div');
  bottomBorder.className = 'bottom-border';
  container.appendChild(bottomBorder);
})();
</script>
