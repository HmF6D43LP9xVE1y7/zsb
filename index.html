        <script>
(function() {
    let sqOverlayStyle = null;

    // Create checkbox
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = 'sqOverlayCheckbox';
    checkbox.style.position = 'fixed';
    checkbox.style.top = '10px';
    checkbox.style.left = '10px';
    checkbox.style.zIndex = '1000001';

    // Label (optional)
    const label = document.createElement('label');
    label.htmlFor = 'sqOverlayCheckbox';
    label.style.position = 'fixed';
    label.style.top = '10px';
    label.style.left = '35px';
    label.style.zIndex = '1000001';
    label.style.fontFamily = 'monospace';
    label.style.fontSize = '12px';

    document.body.appendChild(checkbox);
    document.body.appendChild(label);

    // Toggle overlay
    function toggleSQOverlay() {
        if (checkbox.checked) {
            sqOverlayStyle = document.createElement('style');
            sqOverlayStyle.id = 'sq-overlay';
            sqOverlayStyle.textContent = `
                .SQ {
                    background-color: rgba(0, 255, 0, .15);
                    z-index: 99;
                    position: fixed;
                    user-select: none;
                    pointer-events: none;
                    width: calc(100vw - calc((var(--maxWidth) / var(--baseValue)) * 2));
                    height: calc(100vh - calc((var(--maxWidth) / var(--baseValue)) * 2));
                    margin: calc((var(--maxWidth) / var(--baseValue)) * 1);
                }
                div, a, svg, p, img, * {
                    background-color: rgba(255, 0, 0, .15);
                }
            `;
            document.head.appendChild(sqOverlayStyle);
        } else {
            const existing = document.getElementById('sq-overlay');
            if (existing) existing.remove();
            sqOverlayStyle = null;
        }
    }

    checkbox.addEventListener('change', toggleSQOverlay);
})();
</script>

                <script>
                    document.addEventListener('DOMContentLoaded', () => {
                        const targetSVGs = [...document.querySelectorAll('.pulse')].filter(svg => {
                            return svg.querySelector('circle, rect');
                        });

                        if (targetSVGs.length === 0) {
                            console.log('No pulsing SVGs found.');
                            return;
                        }

                        console.log(`Found ${targetSVGs.length} pulsing SVG(s)`);

                        // Configuration - Start AT 100%
                        const config = {
                            baseScale: 1.0,       // Starting point is exactly 100%
                            minScale: .5,       // Shrink to 85% during pulse
                            maxScale: 1,       // Grow to 115% during pulse  
                            baseDuration: 4000,   // Base animation duration in ms
                            phaseOffset: true,    // Randomize animation start phases
                            animateGroup: false   // If true, entire SVG pulses; else each shape
                        };

                        targetSVGs.forEach((svg, svgIndex) => {
                            const shapes = svg.querySelectorAll('circle, rect');
                            
                            shapes.forEach((shape, shapeIndex) => {
                                // Set transform origin for proper scaling
                                if (shape.tagName === 'circle') {
                                    const cx = shape.getAttribute('cx') || '50%';
                                    const cy = shape.getAttribute('cy') || '50%';
                                    shape.style.transformOrigin = `${cx} ${cy}`;
                                } else if (shape.tagName === 'rect') {
                                    shape.style.transformOrigin = 'center center';
                                }

                                // Randomized pulse parameters per element
                                const randomPhase = config.phaseOffset ? Math.random() * config.baseDuration : 0;
                                const randomDuration = config.baseDuration * (0.8 + Math.random() * .4);
                                
                                // Animation timing - starts AT 100%, then pulses down/up
                                const animationName = `pulse-${shapeIndex}-${svgIndex}`;
                                
                                Object.assign(shape.style, {
                                    'animation': `${animationName} ${randomDuration}ms ease-in-out infinite`,
                                    'animation-delay': `${randomPhase}ms`,
                                    '--base-scale': `${config.baseScale}`,
                                    '--min-scale': `${config.minScale}`,
                                    '--max-scale': `${config.maxScale}`
                                });

                                // Inject keyframes - STARTS at 100%
                                const keyframeStyle = document.createElement('style');
                                keyframeStyle.textContent = `
                                    @keyframes ${animationName} {
                                        0% {
                                            transform: scale(${config.baseScale});
                                        }
                                        25% {
                                            transform: scale(${config.minScale});
                                        }
                                        75% {
                                            transform: scale(${config.maxScale});
                                        }
                                        100% {
                                            transform: scale(${config.baseScale});
                                        }
                                    }
                                `;
                                document.head.appendChild(keyframeStyle);
                            });
                        });
                    });
                </script>
